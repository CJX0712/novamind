[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novamind"
version = "1.0.0"
description = "本地优先的模块化 AI 智能体系统：检索增强生成（RAG）+ 工具编排"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "晨星" }]
keywords = ["ai", "rag", "llm", "agent", "embeddings", "retrieval"]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "httpx==0.28.1",
    "numpy==2.2.1",
    "qdrant-client==1.12.1",
    "pypdf==6.19.0",
    "rank-bm25==0.2.2",
    "onnxruntime==1.20.1",
    "tokenizers==0.21.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
